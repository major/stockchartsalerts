[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stockchartsalerts"
version = "0.1.0"
description = "Poll StockCharts alerts and send new alerts to Discord webhooks."
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.10,<3",
    "tzdata>=2024.1",
]

[project.scripts]
stockchartsalerts = "stockchartsalerts.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8.1",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stockchartsalerts"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/stockchartsalerts"]

[tool.pyright]
include = ["src/stockchartsalerts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = """
--cov-context=test
--disable-socket
--allow-hosts=127.0.0.0/8,::1/128
--allow-unix-socket
"""
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
core = "ctrace"
branch = true
source = ["stockchartsalerts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.18"
