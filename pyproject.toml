[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stockchartsalerts"
version = "0.1.0"
description = "Poll StockCharts alerts and send new alerts to Discord webhooks."
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.10,<3",
    "tzdata>=2024.1",
]

[project.scripts]
stockchartsalerts = "stockchartsalerts.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "mypy>=1.15",
    "pip-audit>=2.9",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-randomly>=3.15",
    "pytest-socket>=0.8.1",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stockchartsalerts"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/stockchartsalerts"]

[tool.pyright]
include = ["src/stockchartsalerts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = """
--cov-context=test
--disable-socket
--allow-hosts=127.0.0.0/8,::1/128
--allow-unix-socket
"""
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = [
    "src",
    "tests",
]
target-version = "py314"

[tool.ruff.lint]
preview = false
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "E",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
# These rules conflict with Ruff's formatter.
ignore = [
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Pytest tests use assertions to check behavior.
"tests/**" = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
core = "ctrace"
branch = true
source = ["stockchartsalerts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.mutmut]
source_paths = ["src/stockchartsalerts"]
only_mutate = [
    "src/stockchartsalerts/alerts.py",
    "src/stockchartsalerts/config.py",
    "src/stockchartsalerts/discord.py",
]
pytest_add_cli_args_test_selection = ["tests"]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.12.18"
