# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true

reviews:
  path_instructions:
    - path: "src/stockchartsalerts/**/*.py"
      instructions: |
        Follow the Python house rules in AGENTS.md. Keep deterministic domain logic separate from I/O and logging. Preserve America/New_York timestamp parsing and elapsed-time comparisons across DST. Reuse one shared httpx.AsyncClient, with complete request deadlines and graceful cancellation. Keep retries bounded, Discord delivery best effort, and diagnostics free of webhook URLs or raw rejected rows. Support only DISCORD_WEBHOOK_URLS. Prefer the smallest typed design that preserves the documented behaviors.
    - path: "tests/**/*.py"
      instructions: |
        Prefer sociable, behavior-focused tests with real internal collaborators. Substitute only external or nondeterministic HTTP, clock, wait, and process boundaries. Avoid private production APIs, internal monkeypatching, and implementation-sensitive assertions. Keep meaningful public parser and validation tests. Assess realistic regression protection, not test counts or coverage percentages.
